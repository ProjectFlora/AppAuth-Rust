[package]
name = "appauth-rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
http = "1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
