name: Rust CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: rust-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace --all-targets --all-features

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test iOS simulator selection policy
        run: python3 -m unittest discover -s scripts -p test_select_ios_simulator.py
      - run: cargo test --locked --workspace --all-targets --all-features
      - run: cargo doc --locked --no-deps
      - name: Generate native bindings
        run: scripts/generate-bindings.sh

  apple_adapters:
    name: Apple adapters validation (iOS ${{ matrix.ios_simulator }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - ios_simulator: '18'
            runner: macos-15
          - ios_simulator: latest
            runner: xcode-27
    env:
      IOS_SIMULATOR_MAJOR_VERSION: ${{ matrix.ios_simulator }}
    steps:
      - uses: actions/checkout@v4
      - name: Select newest installed Xcode for latest iOS
        if: matrix.ios_simulator == 'latest'
        run: |
          developer_dir=$(python3 - <<'PY'
          import glob
          import re
          candidates = []
          for path in glob.glob('/Applications/Xcode*.app'):
              match = re.fullmatch(r'/Applications/Xcode_(\d+(?:\.\d+)*)\.app', path)
              if match:
                  candidates.append((tuple(map(int, match[1].split('.'))), path))
          if not candidates:
              raise SystemExit('No stable versioned Xcode installation found')
          print(max(candidates)[1] + '/Contents/Developer')
          PY
          )
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/check-apple-targets.sh
      - run: scripts/check-apple-adapters.sh
      - name: Remove cached XCFramework package output
        run: rm -rf target/apple/release-package
      - name: Package Apple XCFramework
        run: scripts/package-apple-xcframework.sh 0.0.0-ci
      - name: Validate current Apple package consumer
        run: scripts/check-apple-release-consumer.sh target/apple/release-package/AppAuthRust-Apple-0.0.0-ci.zip
      - uses: actions/upload-artifact@v4
        with:
          name: apple-xcframework-ios-${{ matrix.ios_simulator }}
          path: target/apple/release-package/AppAuthRust-Apple-0.0.0-ci.zip
          if-no-files-found: error
          retention-days: 14

  apple_validation:
    name: Apple adapters validation
    needs: apple_adapters
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require both iOS configurations to pass
        env:
          APPLE_RESULT: ${{ needs.apple_adapters.result }}
        run: test "$APPLE_RESULT" = success

  windows_core:
    name: Windows core target validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --lib --target x86_64-pc-windows-msvc
      - run: cargo test --locked --lib --target x86_64-pc-windows-msvc
      - run: dotnet build native/windows/dotnet/AppAuthWindows.csproj --configuration Release
      - name: Build current Windows package and validate external consumers
        shell: pwsh
        run: |
          cargo build --locked --release --lib --target x86_64-pc-windows-msvc
          $package = "target/windows-audit-package"
          New-Item -ItemType Directory -Force "$package/include" | Out-Null
          New-Item -ItemType Directory -Force "$package/dotnet" | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/appauth_rust.dll" $package
          Copy-Item "target/x86_64-pc-windows-msvc/release/appauth_rust.dll.lib" $package
          Copy-Item "native/windows/include/appauth_windows.h" "$package/include"
          Copy-Item "native/windows/dotnet/AppAuthWindows.cs" "$package/dotnet"
          Copy-Item "native/windows/dotnet/AppAuthWindows.csproj" "$package/dotnet"
          Compress-Archive -Path "$package/*" -DestinationPath "target/windows-audit-package.zip" -Force
          scripts/check-windows-release-consumer.ps1 -Package target/windows-audit-package.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-audit-package
          path: target/windows-audit-package.zip
          if-no-files-found: error
          retention-days: 14

  windows_client:
    name: Windows 11 client consumers (x64 emulation)
    needs: windows_core
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-audit-package
          path: dist
      - name: Record and verify client host
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          if ($os.ProductType -ne 1 -or $os.Caption -notlike '*Windows 11*') {
            throw "Expected a Windows 11 client runner: $($os.Caption)"
          }
          $record = "$($os.Caption), version $($os.Version), build $($os.BuildNumber); host $env:PROCESSOR_ARCHITECTURE; x64 consumers under emulation; image $env:ImageVersion"
          Write-Output $record
          $record | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - name: Execute x64 C++ and .NET consumers on Windows 11
        shell: pwsh
        run: scripts/check-windows-release-consumer.ps1 -Package dist/windows-audit-package.zip

  android_adapters:
    name: Android adapters validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure Android NDK
        env:
          ANDROID_API_LEVEL: '28'
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_API_LEVEL=$ANDROID_API_LEVEL" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./native/android/gradlew -p native/android testDebugUnitTest
      - run: ./native/android/gradlew -p native/android assembleRelease
      - name: Enable Android emulator hardware acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Run Android callback tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: google_apis_playstore
          disable-linux-hw-accel: false
          disable-animations: true
          script: |
            ./native/android/gradlew -p native/android connectedDebugAndroidTest || { echo "::group::Android emulator diagnostics"; adb devices -l || true; adb shell getprop || true; adb shell dumpsys activity activities || true; adb shell dumpsys window windows || true; adb exec-out uiautomator dump /dev/tty || true; adb logcat -d -t 500 || true; echo "::endgroup::"; exit 1; }
            scripts/check-android-release-consumer.sh native/android/build/outputs/aar/appauth-rust-android-release.aar
      - name: Verify Android native libraries in AAR
        run: |
          aar=native/android/build/outputs/aar/appauth-rust-android-release.aar
          unzip -Z1 "$aar" | grep -Fx jni/arm64-v8a/libappauth_rust.so
          unzip -Z1 "$aar" | grep -Fx jni/x86_64/libappauth_rust.so
      - uses: actions/upload-artifact@v4
        with:
          name: android-aar
          path: native/android/build/outputs/aar/appauth-rust-android-release.aar
          if-no-files-found: error
          retention-days: 14

  lint:
    name: Formatting and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  coverage:
    name: Coverage
    outputs:
      line_coverage: ${{ steps.coverage_summary.outputs.line_coverage }}
      function_coverage: ${{ steps.coverage_summary.outputs.function_coverage }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Generate LCOV report
        run: cargo llvm-cov --workspace --all-targets --all-features --lcov --output-path lcov.info
      - name: Report coverage summary
        id: coverage_summary
        run: |
          cargo llvm-cov report | tee coverage-summary.txt
          cat coverage-summary.txt >> "$GITHUB_STEP_SUMMARY"
          line_coverage=$(awk '$1 == "TOTAL" { print $10; exit }' coverage-summary.txt)
          function_coverage=$(awk '$1 == "TOTAL" { print $7; exit }' coverage-summary.txt)
          test -n "$line_coverage"
          test -n "$function_coverage"
          echo "line_coverage=$line_coverage" >> "$GITHUB_OUTPUT"
          echo "function_coverage=$function_coverage" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: lcov-coverage
          path: lcov.info
          if-no-files-found: error
          retention-days: 14

  # GITHUB_TOKEN is write-enabled only for same-repository PRs; fork PRs keep read-only checks.
  report:
    name: PR report
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    needs: [test, apple_adapters, android_adapters, windows_core, windows_client, lint, coverage]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- appauth-rust-ci-report -->';
            const checks = [
              ['Tests', '${{ needs.test.result }}'],
              ['Apple adapters validation', '${{ needs.apple_adapters.result }}'],
              ['Android adapters validation', '${{ needs.android_adapters.result }}'],
              ['Windows core target validation', '${{ needs.windows_core.result }}'],
              ['Windows 11 client consumers (x64 emulation)', '${{ needs.windows_client.result }}'],
              ['Formatting and Clippy', '${{ needs.lint.result }}'],
            ];
            const resultLabel = result =>
              result === 'success' ? '✅ passed' :
              result === 'failure' ? '❌ failed' :
              `⚠️ ${result}`;
            const coverageResult = '${{ needs.coverage.result }}';
            const formatCoverage = value =>
              /^\d{1,3}(?:\.\d+)?%$/.test(value) ? value : 'unavailable';
            const lineCoverage = formatCoverage('${{ needs.coverage.outputs.line_coverage }}');
            const functionCoverage = formatCoverage('${{ needs.coverage.outputs.function_coverage }}');
            const { owner, repo } = context.repo;
            const body = [
              marker,
              '### CI results',
              '',
              '| Check | Result |',
              '| --- | --- |',
              ...checks.map(([name, result]) => `| ${name} | ${resultLabel(result)} |`),
              `| Coverage | ${resultLabel(coverageResult)} — lines ${lineCoverage}, functions ${functionCoverage} |`,
              '',
              `[View workflow run](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId})`,
            ].join('\n');
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
