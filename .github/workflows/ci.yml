name: Rust CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: rust-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace --all-targets --all-features

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace --all-targets --all-features
      - name: Generate native bindings
        run: scripts/generate-bindings.sh

  apple_adapters:
    name: Apple adapters validation
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/check-apple-adapters.sh

  android_adapters:
    name: Android adapters validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Android Rust targets
        env:
          ANDROID_API_LEVEL: '34'
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          scripts/check-android-targets.sh
      - uses: gradle/actions/setup-gradle@v4
      - run: ./native/android/gradlew -p native/android testDebugUnitTest

  lint:
    name: Formatting and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  coverage:
    name: Coverage
    outputs:
      line_coverage: ${{ steps.coverage_summary.outputs.line_coverage }}
      function_coverage: ${{ steps.coverage_summary.outputs.function_coverage }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Generate coverage summary
        id: coverage_summary
        run: |
          cargo llvm-cov --workspace --all-targets --all-features --summary-only | tee coverage-summary.txt
          cat coverage-summary.txt >> "$GITHUB_STEP_SUMMARY"
          line_coverage=$(awk '$1 == "TOTAL" { print $10; exit }' coverage-summary.txt)
          function_coverage=$(awk '$1 == "TOTAL" { print $7; exit }' coverage-summary.txt)
          test -n "$line_coverage"
          test -n "$function_coverage"
          echo "line_coverage=$line_coverage" >> "$GITHUB_OUTPUT"
          echo "function_coverage=$function_coverage" >> "$GITHUB_OUTPUT"
      - name: Generate LCOV report
        run: cargo llvm-cov --workspace --all-targets --all-features --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: lcov-coverage
          path: lcov.info
          if-no-files-found: error
          retention-days: 14

  # GITHUB_TOKEN is write-enabled only for same-repository PRs; fork PRs keep read-only checks.
  report:
    name: PR report
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    needs: [test, apple_adapters, android_adapters, lint, coverage]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- appauth-rust-ci-report -->';
            const checks = [
              ['Tests', '${{ needs.test.result }}'],
              ['Apple adapters validation', '${{ needs.apple_adapters.result }}'],
              ['Android adapters validation', '${{ needs.android_adapters.result }}'],
              ['Formatting and Clippy', '${{ needs.lint.result }}'],
            ];
            const resultLabel = result =>
              result === 'success' ? '✅ passed' :
              result === 'failure' ? '❌ failed' :
              `⚠️ ${result}`;
            const coverageResult = '${{ needs.coverage.result }}';
            const formatCoverage = value =>
              /^\d{1,3}(?:\.\d+)?%$/.test(value) ? value : 'unavailable';
            const lineCoverage = formatCoverage('${{ needs.coverage.outputs.line_coverage }}');
            const functionCoverage = formatCoverage('${{ needs.coverage.outputs.function_coverage }}');
            const { owner, repo } = context.repo;
            const body = [
              marker,
              '### CI results',
              '',
              '| Check | Result |',
              '| --- | --- |',
              ...checks.map(([name, result]) => `| ${name} | ${resultLabel(result)} |`),
              `| Coverage | ${resultLabel(coverageResult)} — lines ${lineCoverage}, functions ${functionCoverage} |`,
              '',
              `[View workflow run](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId})`,
            ].join('\n');
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
