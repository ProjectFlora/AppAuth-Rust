name: Published release consumer validation

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published release version to validate
        required: true
        default: 0.4.0
        type: string

permissions:
  contents: read

jobs:
  apple:
    name: Validate published Apple consumer
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify Apple release archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          mkdir dist
          gh release download "v$RELEASE_VERSION" \
            --pattern "AppAuthRust-Apple-$RELEASE_VERSION.zip" \
            --pattern SHA256SUMS \
            --dir dist
          cd dist
          grep -F "  AppAuthRust-Apple-$RELEASE_VERSION.zip" SHA256SUMS | shasum -a 256 -c -
      - run: scripts/check-apple-release-consumer.sh dist/AppAuthRust-Apple-${{ inputs.version }}.zip

  spm:
    name: Validate published SPM consumer
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      # No checkout: the consumer is a foreign package that only knows the
      # published release tag, exactly like a real SPM consumer. SPM resolves
      # the tag, downloads the binary target from the manifest URL (verifying
      # the checksum the release pipeline prepared), and compiles the
      # generated Swift API and the platform adapters it ships.
      - name: Create the SPM consumer package
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          mkdir -p Sources/Consumer
          # $GITHUB_REPOSITORY and $RELEASE_VERSION are shell-expanded into
          # the manifest: the consumer depends on the published release
          # exactly as a foreign package would.
          cat > Package.swift <<EOF
          // swift-tools-version: 6.0
          import PackageDescription

          let package = Package(
              name: "Consumer",
              platforms: [
                  .iOS(.v18),
                  .macOS(.v15),
              ],
              dependencies: [
                  .package(
                      url: "https://github.com/$GITHUB_REPOSITORY",
                      exact: "$RELEASE_VERSION"
                  ),
              ],
              targets: [
                  .executableTarget(
                      name: "Consumer",
                      dependencies: [
                          .product(name: "AppAuthRust", package: "AppAuth-Rust"),
                      ]
                  ),
              ]
          )
          EOF
          cat > Sources/Consumer/Consumer.swift <<'EOF'
          import AppAuthRust

          enum ConsumerError: Error {
              case roundTripMismatch
              case configurationMismatch
          }

          @main
          struct Main {
              static func main() async throws {
                  // The same host-side smoke the in-tree package runs in its
                  // tests: exercise the generated API through the binary
                  // target's FFI module, with no network activity.
                  let stateJson = #"{\"token_response\":{\"access_token\":\"old\",\"token_type\":\"Bearer\",\"refresh_token\":\"refresh\"}}"#
                  let state = try FfiAuthenticationState.fromJson(serialized: stateJson)
                  let serialized = try await state.toJson()
                  let restored = try FfiAuthenticationState.fromJson(serialized: serialized)
                  let reserialized = try await restored.toJson()
                  guard reserialized == serialized else {
                      throw ConsumerError.roundTripMismatch
                  }
                  let response = await restored.tokenResponse()
                  guard response.accessToken == "old" else {
                      throw ConsumerError.roundTripMismatch
                  }

                  let configuration = try FfiServiceConfiguration(
                      authorizationEndpoint: "https://idp.example/authorize",
                      tokenEndpoint: "https://idp.example/token"
                  )
                  let withValidation = try configuration.withOidcValidationEndpoints(
                      issuer: "https://idp.example",
                      jwksUri: "https://idp.example/.well-known/jwks.json"
                  )
                  guard withValidation.issuer() == "https://idp.example/",
                        withValidation.jwksUri() == "https://idp.example/.well-known/jwks.json"
                  else {
                      throw ConsumerError.configurationMismatch
                  }

                  print("Published Swift package consumer smoke passed")
              }
          }
          EOF
      - name: Resolve the published release tag and build for macOS
        run: swift build
      - name: Run the consumer smoke
        run: swift run Consumer
      - name: Build for the iOS simulator
        # A generic destination builds every standard simulator
        # architecture, but the release xcframework ships an arm64
        # simulator slice; exclude the other one (the same arm64 simulator
        # target the archive consumer check links).
        run: xcodebuild -scheme Consumer -destination 'generic/platform=iOS Simulator' EXCLUDED_ARCHS=x86_64 build

  android:
    name: Validate published Android consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable Android emulator hardware acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Download and verify Android release archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          mkdir dist
          gh release download "v$RELEASE_VERSION" \
            --pattern "appauth-rust-android-$RELEASE_VERSION.aar" \
            --pattern SHA256SUMS \
            --dir dist
          cd dist
          grep -F "  appauth-rust-android-$RELEASE_VERSION.aar" SHA256SUMS | shasum -a 256 -c -
      - name: Run Android release consumer on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: google_apis_playstore
          disable-linux-hw-accel: false
          disable-animations: true
          script: scripts/check-android-release-consumer.sh dist/appauth-rust-android-${{ inputs.version }}.aar

  windows:
    name: Validate published Windows consumers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify Windows release archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          gh release download "v$env:RELEASE_VERSION" `
            --pattern "appauth-rust-windows-$env:RELEASE_VERSION.zip" `
            --pattern SHA256SUMS `
            --dir dist
          $asset = "appauth-rust-windows-$env:RELEASE_VERSION.zip"
          $expected = ((Select-String "dist/SHA256SUMS" -Pattern "  $([regex]::Escape($asset))$").Line -split '\s+')[0]
          $actual = (Get-FileHash "dist/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "SHA-256 mismatch for $asset"
          }
      - shell: pwsh
        run: scripts/check-windows-release-consumer.ps1 -Package dist/appauth-rust-windows-${{ inputs.version }}.zip
