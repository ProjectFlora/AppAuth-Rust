name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release candidate version to validate
        required: true
        default: 0.1.0
        type: string

permissions:
  contents: read

jobs:
  validate_version:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - id: version
        name: Match SemVer tag to Cargo package version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$RELEASE_VERSION"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release candidate versions must use MAJOR.MINOR.PATCH" >&2
              exit 1
            fi
          else
            tag="$GITHUB_REF_NAME"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tags must use vMAJOR.MINOR.PATCH" >&2
              exit 1
            fi
            version="${tag#v}"
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tags must point to a commit on main" >&2
            exit 1
          fi
          package_version=$(cargo metadata --locked --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "appauth-rust") | .version')
          if [[ "$version" != "$package_version" ]]; then
            echo "Tag version $version does not match Cargo package version $package_version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

  apple:
    name: Build Apple release package
    needs: validate_version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/check-apple-targets.sh
      - run: scripts/check-apple-adapters.sh
      - name: Remove cached XCFramework package output
        run: rm -rf target/apple/release-package
      - run: scripts/package-apple-xcframework.sh "${{ needs.validate_version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-apple
          path: target/apple/release-package/AppAuthRust-Apple-${{ needs.validate_version.outputs.version }}.zip
          if-no-files-found: error

  android:
    name: Build Android release package
    needs: validate_version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure Android NDK
        env:
          ANDROID_API_LEVEL: '34'
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_API_LEVEL=$ANDROID_API_LEVEL" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./native/android/gradlew -p native/android testDebugUnitTest
      - name: Enable Android emulator hardware acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Run Android callback tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis_playstore
          disable-linux-hw-accel: false
          disable-animations: true
          script: ./native/android/gradlew -p native/android connectedDebugAndroidTest
      - run: ./native/android/gradlew -p native/android assembleRelease
      - name: Verify and stage Android AAR
        env:
          RELEASE_VERSION: ${{ needs.validate_version.outputs.version }}
        run: |
          aar=native/android/build/outputs/aar/appauth-rust-android-release.aar
          unzip -Z1 "$aar" | grep -Fx jni/arm64-v8a/libappauth_rust.so
          unzip -Z1 "$aar" | grep -Fx jni/x86_64/libappauth_rust.so
          mkdir -p dist
          cp "$aar" "dist/appauth-rust-android-$RELEASE_VERSION.aar"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/appauth-rust-android-${{ needs.validate_version.outputs.version }}.aar
          if-no-files-found: error

  api_docs:
    name: Build API reference
    needs: validate_version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace --all-targets --all-features
      - run: cargo doc --locked --no-deps
      - name: Package Rust API reference
        env:
          RELEASE_VERSION: ${{ needs.validate_version.outputs.version }}
        run: |
          mkdir -p dist
          cd target/doc
          zip -rq "$GITHUB_WORKSPACE/dist/AppAuthRust-API-Docs-$RELEASE_VERSION.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: release-api-docs
          path: dist/AppAuthRust-API-Docs-${{ needs.validate_version.outputs.version }}.zip
          if-no-files-found: error

  windows:
    name: Build Windows desktop package
    needs: validate_version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --lib --target x86_64-pc-windows-msvc
      - run: cargo test --locked --lib --target x86_64-pc-windows-msvc
      - name: Build and package Windows library
        env:
          RELEASE_VERSION: ${{ needs.validate_version.outputs.version }}
        run: |
          cargo build --locked --release --lib --target x86_64-pc-windows-msvc
          $package = "dist/appauth-rust-windows-$env:RELEASE_VERSION"
          New-Item -ItemType Directory -Force "$package/include" | Out-Null
          New-Item -ItemType Directory -Force "$package/dotnet" | Out-Null
          $target = "target/x86_64-pc-windows-msvc/release"
          Copy-Item "$target/appauth_rust.dll" $package
          Copy-Item "$target/appauth_rust.dll.lib" $package
          Copy-Item "native/windows/include/appauth_windows.h" "$package/include"
          Copy-Item "native/windows/dotnet/AppAuthWindows.cs" "$package/dotnet"
          Copy-Item "native/windows/dotnet/AppAuthWindows.csproj" "$package/dotnet"
          Copy-Item "native/windows/README.md" $package
          Compress-Archive -Path "$package/*" -DestinationPath "$package.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/appauth-rust-windows-${{ needs.validate_version.outputs.version }}.zip
          if-no-files-found: error

  publish:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    name: Publish GitHub Release
    needs: [validate_version, apple, android, api_docs, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-apple
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-android
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-api-docs
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: dist
      - name: Generate checksums and publish assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate_version.outputs.version }}
        run: |
          cd dist
          shasum -a 256 \
            "AppAuthRust-Apple-$RELEASE_VERSION.zip" \
            "appauth-rust-android-$RELEASE_VERSION.aar" \
            "appauth-rust-windows-$RELEASE_VERSION.zip" \
            "AppAuthRust-API-Docs-$RELEASE_VERSION.zip" \
            > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" \
            "AppAuthRust-Apple-$RELEASE_VERSION.zip" \
            "appauth-rust-android-$RELEASE_VERSION.aar" \
            "appauth-rust-windows-$RELEASE_VERSION.zip" \
            "AppAuthRust-API-Docs-$RELEASE_VERSION.zip" \
            SHA256SUMS \
            --verify-tag \
            --title "AppAuth-Rust $GITHUB_REF_NAME" \
            --generate-notes
