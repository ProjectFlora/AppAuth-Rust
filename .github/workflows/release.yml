name: Release

# Releases are dispatched from main. A run without `publish` validates and
# packages a release candidate. With `publish`, the workflow also writes the
# Apple archive's URL and SHA-256 checksum into Package.swift, commits that as
# a release commit on top of the dispatched main commit, tags it, and
# publishes the GitHub Release. The checksum is only known after the archive
# is built, so the tag is created here rather than pushed beforehand.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (MAJOR.MINOR.PATCH)
        required: true
        default: 0.5.0
        type: string
      publish:
        description: Create the release commit, tag and GitHub Release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # Two dispatch runs of the same version must not race: the first one to
  # publish pushes the version tag, and a racing second run would fail at
  # the tag push only after a full rebuild. Serialize runs of the same
  # version; a publish dispatched behind a candidate run waits for it
  # rather than colliding.
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate_version:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - id: version
        name: Match SemVer release version to Cargo package version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          version="$RELEASE_VERSION"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release versions must use MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          # Candidate runs (no publish) may be dispatched from any branch so
          # release changes can be validated before they merge; publishing
          # requires the dispatched commit to be on main.
          if [[ "$PUBLISH" == "true" ]]; then
            git fetch origin main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "Releases must be built from a commit on main" >&2
              exit 1
            fi
            if [[ "$GITHUB_REF" != refs/heads/main ]]; then
              echo "Publishing releases must be dispatched from main" >&2
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
              echo "Tag v$version already exists" >&2
              exit 1
            fi
          fi
          package_version=$(cargo metadata --locked --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "appauth-rust") | .version')
          if [[ "$version" != "$package_version" ]]; then
            echo "Release version $version does not match Cargo package version $package_version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

  apple:
    name: Build Apple release package
    needs: validate_version
    runs-on: macos-15
    env:
      IOS_SIMULATOR_MAJOR_VERSION: '18'
    steps:
      - uses: actions/checkout@v4
      # The archive's bytes are shaped by the toolchain (the rustc version is
      # part of rustc's -C metadata hash; the Xcode version shapes the
      # xcframework), and the manifest's checksum is computed from them. Pin
      # both to exact versions — the macos-15 image ships Xcode 16.4, so no
      # extra download — and record the exact versions in the step summary so
      # a release archive can be tied to the toolchain that built it.
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - uses: Swatinem/rust-cache@v2
      - name: Record toolchain versions
        run: |
          {
            echo "### Toolchain"
            rustc -vV
            echo
            xcodebuild -version
          } >> "$GITHUB_STEP_SUMMARY"
      - run: scripts/check-apple-adapters.sh
      - name: Remove cached XCFramework package output
        run: rm -rf target/apple/release-package
      - run: scripts/package-apple-xcframework.sh "${{ needs.validate_version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-apple
          path: target/apple/release-package/AppAuthRust-Apple-${{ needs.validate_version.outputs.version }}.zip
          if-no-files-found: error

  android:
    name: Build Android release package
    needs: validate_version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure Android NDK
        env:
          ANDROID_API_LEVEL: '28'
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_API_LEVEL=$ANDROID_API_LEVEL" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./native/android/gradlew -p native/android testDebugUnitTest
      - name: Enable Android emulator hardware acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Run Android callback tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: google_apis_playstore
          disable-linux-hw-accel: false
          disable-animations: true
          script: ./native/android/gradlew -p native/android connectedDebugAndroidTest
      - run: ./native/android/gradlew -p native/android assembleRelease
      - name: Verify and stage Android AAR
        env:
          RELEASE_VERSION: ${{ needs.validate_version.outputs.version }}
        run: |
          aar=native/android/build/outputs/aar/appauth-rust-android-release.aar
          unzip -Z1 "$aar" | grep -Fx jni/arm64-v8a/libappauth_rust.so
          unzip -Z1 "$aar" | grep -Fx jni/x86_64/libappauth_rust.so
          mkdir -p dist
          cp "$aar" "dist/appauth-rust-android-$RELEASE_VERSION.aar"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/appauth-rust-android-${{ needs.validate_version.outputs.version }}.aar
          if-no-files-found: error

  api_docs:
    name: Build API reference
    needs: validate_version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace --all-targets --all-features
      - run: cargo doc --locked --no-deps
      - name: Package Rust API reference
        env:
          RELEASE_VERSION: ${{ needs.validate_version.outputs.version }}
        run: |
          mkdir -p dist
          cd target/doc
          zip -rq "$GITHUB_WORKSPACE/dist/AppAuthRust-API-Docs-$RELEASE_VERSION.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: release-api-docs
          path: dist/AppAuthRust-API-Docs-${{ needs.validate_version.outputs.version }}.zip
          if-no-files-found: error

  windows:
    name: Build Windows desktop package
    needs: validate_version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --lib --target x86_64-pc-windows-msvc
      - run: cargo test --locked --lib --target x86_64-pc-windows-msvc
      - name: Build and package Windows library
        env:
          RELEASE_VERSION: ${{ needs.validate_version.outputs.version }}
        run: |
          cargo build --locked --release --lib --target x86_64-pc-windows-msvc
          $package = "dist/appauth-rust-windows-$env:RELEASE_VERSION"
          New-Item -ItemType Directory -Force "$package/include" | Out-Null
          New-Item -ItemType Directory -Force "$package/dotnet" | Out-Null
          $target = "target/x86_64-pc-windows-msvc/release"
          Copy-Item "$target/appauth_rust.dll" $package
          Copy-Item "$target/appauth_rust.dll.lib" $package
          Copy-Item "native/windows/include/appauth_windows.h" "$package/include"
          Copy-Item "native/windows/dotnet/AppAuthWindows.cs" "$package/dotnet"
          Copy-Item "native/windows/dotnet/AppAuthWindows.csproj" "$package/dotnet"
          Copy-Item "native/windows/README.md" $package
          Compress-Archive -Path "$package/*" -DestinationPath "$package.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/appauth-rust-windows-${{ needs.validate_version.outputs.version }}.zip
          if-no-files-found: error

  apple_consumer:
    name: Validate Apple release consumer
    needs: [validate_version, apple]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-apple
          path: dist
      - run: scripts/check-apple-release-consumer.sh dist/AppAuthRust-Apple-${{ needs.validate_version.outputs.version }}.zip

  android_consumer:
    name: Validate Android release consumer
    needs: [validate_version, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable Android emulator hardware acceleration
        run: sudo chmod a+rw /dev/kvm
      - uses: actions/download-artifact@v4
        with:
          name: release-android
          path: dist
      - name: Run Android release consumer on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: google_apis_playstore
          disable-linux-hw-accel: false
          disable-animations: true
          script: scripts/check-android-release-consumer.sh dist/appauth-rust-android-${{ needs.validate_version.outputs.version }}.aar

  windows_consumer:
    name: Validate Windows release consumers
    needs: [validate_version, windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: dist
      - shell: pwsh
        run: scripts/check-windows-release-consumer.ps1 -Package dist/appauth-rust-windows-${{ needs.validate_version.outputs.version }}.zip

  spm_manifest:
    name: Prepare and validate release Package.swift
    needs: [validate_version, apple]
    runs-on: macos-15
    env:
      RELEASE_VERSION: ${{ needs.validate_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-apple
          path: dist
      - name: Point Package.swift at the release archive
        run: |
          archive="dist/AppAuthRust-Apple-$RELEASE_VERSION.zip"
          checksum=$(swift package compute-checksum "$archive")
          python3 scripts/update-package-swift.py \
            --repository "$GITHUB_REPOSITORY" "$RELEASE_VERSION" "$checksum"
          # The release commit may change nothing but Package.swift.
          git diff --exit-code --stat -- . ':(exclude)Package.swift'
          grep -F "url: \"https://github.com/$GITHUB_REPOSITORY/releases/download/v$RELEASE_VERSION/AppAuthRust-Apple-$RELEASE_VERSION.zip\"," Package.swift
          grep -F "checksum: \"$checksum\"" Package.swift
          git diff -- Package.swift
      # Build and test the rewritten manifest against the archive (the check
      # swaps only the binary target's url/checksum for the local path).
      - run: scripts/check-spm-package.sh "dist/AppAuthRust-Apple-$RELEASE_VERSION.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-package-swift
          path: Package.swift
          if-no-files-found: error

  publish:
    if: ${{ inputs.publish }}
    name: Publish GitHub Release
    needs: [validate_version, apple, android, api_docs, windows, apple_consumer, android_consumer, windows_consumer, spm_manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-apple
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-android
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-api-docs
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-package-swift
          path: release-manifest
      - name: Create release commit and tag
        env:
          RELEASE_VERSION: ${{ needs.validate_version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp release-manifest/Package.swift Package.swift
          git commit -m "release: v$RELEASE_VERSION" -- Package.swift
          if [[ "$(git diff --name-only HEAD~1 HEAD)" != Package.swift ]]; then
            echo "The release commit must change only Package.swift" >&2
            exit 1
          fi
          git tag -a "v$RELEASE_VERSION" -m "AppAuth-Rust v$RELEASE_VERSION"
          # Push only the tag; main keeps the previous release's manifest.
          git push origin "refs/tags/v$RELEASE_VERSION"
      - name: Generate checksums and publish assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate_version.outputs.version }}
        run: |
          cd dist
          shasum -a 256 \
            "AppAuthRust-Apple-$RELEASE_VERSION.zip" \
            "appauth-rust-android-$RELEASE_VERSION.aar" \
            "appauth-rust-windows-$RELEASE_VERSION.zip" \
            "AppAuthRust-API-Docs-$RELEASE_VERSION.zip" \
            > SHA256SUMS
          gh release create "v$RELEASE_VERSION" \
            "AppAuthRust-Apple-$RELEASE_VERSION.zip" \
            "appauth-rust-android-$RELEASE_VERSION.aar" \
            "appauth-rust-windows-$RELEASE_VERSION.zip" \
            "AppAuthRust-API-Docs-$RELEASE_VERSION.zip" \
            SHA256SUMS \
            --verify-tag \
            --title "AppAuth-Rust v$RELEASE_VERSION" \
            --generate-notes
